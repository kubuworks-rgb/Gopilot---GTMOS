name: CI

# Runs entirely without search-provider credentials. Nothing here calls Exa,
# Tavily, or any external research provider — BYOA is provider-independent by
# design, and that property is part of what CI protects.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  PYTHONPATH: ${{ github.workspace }}
  # Explicitly absent so a provider can never be reached from CI.
  EXA_API_KEY: ""
  TAVILY_API_KEY: ""

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check apps/api services/research_gateway services/worker services/dev_oidc services/mcp_server packages/entity-safety
      - name: Mypy
        run: python -m mypy apps/api/app services/research_gateway/app services/worker/app services/dev_oidc services/mcp_server packages/entity-safety/entity_safety
      - name: Pytest
        run: python -m pytest apps/api/tests services/research_gateway/tests packages/entity-safety/tests -q

  frontend:
    name: Frontend (eslint, tsc, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint --workspace apps/web
      - name: TypeScript
        run: npm run typecheck --workspace apps/web
      - name: Tests
        run: npm run test --workspace apps/web
      - name: Setup CLI tests
        run: node --test cli/tests/*.test.mjs
      - name: Next.js build
        run: npm run build --workspace apps/web

  # The setup path is the first five minutes of anyone's experience with this
  # repo, and it was previously verified only on the maintainer's Windows
  # machine, where Python packages were already installed. Runners are fresh by
  # definition, so this is also the only place a truthful "clone to running"
  # number can come from.
  #
  # Every step runs under bash, which GitHub provides on all three runners, so
  # one script covers the matrix rather than three shell dialects.
  cross-platform:
    name: Setup CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Deliberately uncached: a cache hit would measure the cache, not the
      # experience someone actually has on a clean machine.
      - name: Install Python dependencies (fresh, timed)
        shell: bash
        run: |
          start=$(date +%s)
          pip install -r apps/api/requirements-dev.txt
          echo "PY_INSTALL=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies (fresh, timed)
        shell: bash
        run: |
          start=$(date +%s)
          npm ci
          echo "NPM_INSTALL=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Full test suite
        shell: bash
        run: |
          python -m pytest apps/api/tests services/research_gateway/tests packages/entity-safety/tests -q
          npm run test --workspace apps/web
          node --test cli/tests/*.test.mjs

      - name: npx gopilot -y reaches a serving stack
        shell: bash
        run: |
          start=$(date +%s)
          npx gopilot -y --no-open > gopilot.log 2>&1 &
          ready=0
          for _ in $(seq 1 120); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8000/api/v1/bootstrap || true)
            web=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3000 || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          elapsed=$(( $(date +%s) - start ))
          echo "----- gopilot output -----"
          cat gopilot.log || true
          echo "--------------------------"
          if [ "$ready" != "1" ]; then
            echo "::error::npx gopilot never reached a serving state on ${{ matrix.os }}"
            exit 1
          fi
          # Serving is not enough; assert it served the real fixture payload.
          curl -s --max-time 10 http://127.0.0.1:8000/api/v1/bootstrap > bootstrap.json
          node -e "
            const d = require('./bootstrap.json');
            if (d.mode !== 'fixture') { console.error('mode was', d.mode); process.exit(1); }
            if (!Array.isArray(d.accounts) || d.accounts.length === 0) { console.error('no accounts'); process.exit(1); }
            if (d.accounts[0].scores.fit.determined === undefined) { console.error('determined flag missing'); process.exit(1); }
            console.log('payload OK:', d.accounts.length, 'accounts, mode', d.mode);
          "
          echo "CLI_READY=${elapsed}" >> "$GITHUB_ENV"

      - name: Record timings
        shell: bash
        run: |
          total=$(( PY_INSTALL + NPM_INSTALL + CLI_READY ))
          {
            echo "### ${{ matrix.os }}"
            echo ""
            echo "| phase | seconds |"
            echo "| --- | ---: |"
            echo "| pip install (fresh) | ${PY_INSTALL} |"
            echo "| npm ci (fresh) | ${NPM_INSTALL} |"
            echo "| npx gopilot -y until serving | ${CLI_READY} |"
            echo "| **total, checkout to serving** | **${total}** |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TIMING ${{ matrix.os }}: py=${PY_INSTALL}s npm=${NPM_INSTALL}s cli=${CLI_READY}s total=${total}s"

  database:
    name: Database (alembic + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gtm
          POSTGRES_PASSWORD: gtm
          POSTGRES_DB: gtm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gtm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://gtm:gtm@127.0.0.1:5432/gtm
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r apps/api/requirements-dev.txt
      - name: Alembic upgrade to head
        run: python -m alembic -c apps/api/alembic.ini upgrade head
      - name: Alembic reports the expected head
        run: python -m alembic -c apps/api/alembic.ini current
      - name: Offline SQL generation
        run: python -m alembic -c apps/api/alembic.ini upgrade head --sql > /dev/null
      - name: Migrations are reversible
        run: |
          python -m alembic -c apps/api/alembic.ini downgrade -1
          python -m alembic -c apps/api/alembic.ini upgrade head
      - name: Schema matches model metadata
        run: python -m alembic -c apps/api/alembic.ini check
      - name: Live database integration tests
        env:
          RUN_LIVE_DB_TESTS: "1"
          RESEARCH_MODE: live
        run: python -m pytest apps/api/tests/test_live_database_integration.py -q
      - name: Worker reliability against real Redis
        env:
          RUN_LIVE_REDIS_TESTS: "1"
        run: python -m pytest apps/api/tests/test_worker_reliability.py -q

  security:
    name: Security (gateway, secrets, whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r apps/api/requirements-dev.txt
      - name: Gateway security tests
        run: python -m pytest services/research_gateway/tests/test_security.py -q
      - name: Authentication tests
        run: python -m pytest apps/api/tests/test_authentication.py -q
      - name: Whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" HEAD
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            echo "Single commit; nothing to compare."
          fi
      - name: Secret scan
        run: python scripts/secret_scan.py
