# TLS overlay for the private-alpha stack.
#
#   docker compose -f docker-compose.private-alpha.yml -f docker-compose.tls.yml \
#     --env-file .env.private-alpha up -d
#
# Caddy terminates TLS and is the only service with published ports. The web
# container stops publishing 3000 directly, so skipping this overlay cannot leave
# a plaintext port open by accident -- see docs/operations/DEPLOYMENT.md.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the hostname this deployment answers on}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notifications}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

  web:
    # Reachable only through Caddy on the internal network.
    ports: !override []

volumes:
  caddy_data:
  caddy_config:
